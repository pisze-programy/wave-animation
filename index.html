<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wave animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <div class="card" id="card">
      <canvas class="wave" id="wave" aria-hidden="true"></canvas>
      <div class="overlay">
        <span class="hairline" aria-hidden="true"></span>
        <div class="action" id="action">
          <div class="beam-outer" id="beamOuter" aria-hidden="true"></div>
          <button type="button" class="cta" id="cta">
            <span class="beam-inner" id="beamInner" aria-hidden="true"></span>
            <span class="cta-title" id="ctaTitle">Install Now</span>
          </button>
        </div>
      </div>
    </div>

    <button type="button" class="pill" id="play">Play</button>

    <label class="scrub">
      <span>Frame</span>
      <input type="range" id="scrub" min="0" max="5.62" step="0.01" value="0" />
      <output id="scrubOut">0.00 s</output>
    </label>
  </main>

  <script src="wave.js"></script>
  <script src="card.js"></script>
  <script src="main.js"></script>
</body>
</html>
